<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baraka × The Ocean Blue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#FFFAF0;--card:#fff;--ink:#22160B;--mute:#7C6A56;--brown:#2A1707;--green:#6BA53A;--gold:#F2A93B;--cream:#FFE9C2;--rest:#F0713A;--deli:#7FC043;--perf:#A99C8C;--shadow:0 24px 60px -34px rgba(42,23,7,.45);color-scheme:light}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brown)}
img{max-width:100%;display:block}
h1,h2,h3{font-family:"Outfit","Plus Jakarta Sans",sans-serif;margin:0;line-height:1.02;letter-spacing:-.02em;text-wrap:balance}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#B9741A}
.eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(242,169,59,.25)}
.dark .eyebrow{color:var(--gold)}
/* reveal */
.js .rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.js .rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(42,23,7,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav .wrap{display:flex;align-items:center;gap:16px;height:60px}
.nav .brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:"Outfit";font-weight:700;font-size:1.15rem;margin-right:auto}
.nav .brand img{width:34px;height:34px;border-radius:50%;border:2px solid var(--gold);background:#fff}
.nav .links{display:flex;gap:6px}
.nav .links button{all:unset;cursor:pointer;color:#EBDDC6;font-weight:600;font-size:.9rem;padding:7px 14px;border-radius:999px}
.nav .links button:hover{background:rgba(255,255,255,.1);color:#fff}
@media(max-width:760px){.nav .links{display:none}}
.flags{display:flex;gap:8px}
.flag{all:unset;display:block;cursor:pointer;width:34px;height:34px;border-radius:50%;overflow:hidden;position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.25);transition:transform .2s,box-shadow .2s;opacity:.6}
.flag svg{width:100%;height:100%;display:block}
.flag:hover{transform:scale(1.08);opacity:1}
.flag[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 3px var(--gold)}
.flag:focus-visible,.lang:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding-block:clamp(48px,9vw,110px) clamp(60px,10vw,120px);background:radial-gradient(900px 480px at 90% -8%,rgba(242,169,59,.42),transparent 62%),radial-gradient(800px 520px at -5% 105%,rgba(107,165,58,.42),transparent 60%),#1D1005}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.10;filter:blur(3px) saturate(1.2)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,5vw,60px);align-items:center}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}}
.logo{width:clamp(76px,12vw,104px);border-radius:50%;border:4px solid var(--gold);background:#fff;margin-bottom:22px;box-shadow:0 0 0 10px rgba(242,169,59,.16)}
.hero h1{font-size:clamp(2.9rem,9vw,6rem);font-weight:800;margin-top:14px}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#FFD58A,#F2A93B 55%,#B7DE86);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{margin:18px 0 0;max-width:46ch;color:#EBDDC6;font-size:clamp(1.02rem,2vw,1.22rem)}
.ar{font-size:.5em;vertical-align:.7em;margin-left:.3em;color:var(--gold);font-weight:600}
.pick{margin-top:30px}
.pick small{display:block;color:#CDBB9F;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:10px}
.pick .row{display:flex;flex-wrap:wrap;gap:10px}
.lang{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff;font-weight:600;transition:background .2s,transform .2s}
.lang:hover{background:rgba(255,255,255,.16);transform:translateY(-2px)}
.lang[aria-pressed="true"]{background:#fff;color:var(--brown);border-color:#fff}
.lang .flag{width:30px;height:30px;box-shadow:none;opacity:1;pointer-events:none}
.glass{display:grid;gap:14px}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:26px;padding:18px 22px;display:flex;align-items:center;gap:16px}
.stat:nth-child(1){transform:rotate(-1.5deg)}.stat:nth-child(2){transform:translateX(24px) rotate(1deg)}.stat:nth-child(3){transform:rotate(-.8deg)}
@media(max-width:900px){.stat:nth-child(n){transform:none}}
.stat b{font-family:"Outfit";font-size:2.4rem;line-height:1;background:linear-gradient(90deg,#FFD58A,#F2A93B);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.stat span{color:#EBDDC6;font-size:.95rem;line-height:1.3}
/* sections */
section.part{padding-block:clamp(56px,9vw,110px)}
section.soft{background:linear-gradient(180deg,#FFF3DB,#FFFAF0)}
.head{margin-bottom:34px;max-width:720px}
.head h2{font-size:clamp(1.15rem,3vw,1.6rem);font-weight:600;color:#9A6A1E;margin-top:12px;letter-spacing:-.01em}
.head p{margin:14px 0 0;color:var(--mute);font-size:1.08rem}

section.part{position:relative}
section.part::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,#F2A93B,#7DBB45)}
.head .eyebrow.step{display:flex;flex-wrap:nowrap;align-items:center;gap:10px 14px;font-size:1rem;letter-spacing:0;text-transform:none;color:var(--brown);margin-bottom:6px}
.head .eyebrow.step::before{display:none}
.step .stn{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:"Outfit";font-weight:800;font-size:1.5rem;color:var(--brown);background:linear-gradient(135deg,#FFD58A,#F2A93B);box-shadow:0 0 0 6px rgba(242,169,59,.22);flex:none}
.step .stp{background:var(--brown);color:#fff;border-radius:999px;padding:9px 20px;font-weight:800;font-size:.9rem;letter-spacing:.16em;text-transform:uppercase}
.step .stt{font-family:"Outfit";font-weight:800;font-size:clamp(1.9rem,5.6vw,3.5rem);line-height:1.05;letter-spacing:-.02em;color:var(--brown);flex:1 1 260px;min-width:0;text-wrap:balance}
.head.sub{max-width:none;margin-top:clamp(56px,9vw,96px);padding-top:clamp(36px,6vw,56px);border-top:2px dashed #E3C98E}
.head.sub>*{max-width:720px}
.head .eyebrow.step{max-width:none}
.head{position:relative}
.head h2{margin-top:12px}
/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c12{grid-column:span 12}
@media(max-width:900px){.c7,.c5{grid-column:span 12}}
.card{background:var(--card);border-radius:30px;overflow:hidden;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr;margin:0}
.card .im{position:relative;background:#F4E9D5}
.card .im img{width:100%;height:auto}
.pill{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:999px;padding:7px 15px;font-family:"Outfit";font-weight:700;font-size:1.05rem;color:var(--brown);box-shadow:0 8px 20px -10px rgba(0,0,0,.4)}
.card .tx{padding:20px 24px 24px;display:grid;gap:8px;align-content:start}
.card h3{font-size:1.6rem}
.card .st{color:var(--mute);font-size:.9rem;font-weight:600}
.card p{margin:0;font-size:1rem}
.tag{justify-self:start;font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:5px 12px}
.t-good{background:#E4F3D4;color:#3C6B16}.t-mid{background:#FFEBC7;color:#8A5600}.t-low{background:#FFE0D3;color:#A63E10}
.card.wide{grid-template-columns:minmax(0,.55fr) minmax(0,1fr);grid-template-rows:none}
.card.wide .im{display:grid;place-items:center;padding:18px}
.card.wide .im img{max-width:260px;border-radius:18px;box-shadow:0 16px 36px -20px rgba(0,0,0,.5)}
.card.wide .tx{align-content:center;padding:28px}
@media(max-width:700px){.card.wide{grid-template-columns:1fr}}
.trio{margin-top:18px;border-radius:34px;background:linear-gradient(120deg,#2A1707 0%,#3B2410 55%,#3E5A1F 130%);color:#fff;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
@media(max-width:800px){.trio{grid-template-columns:1fr}}
.trio>div{padding:clamp(22px,3.5vw,36px);border-right:1px solid rgba(255,255,255,.1)}
.trio>div:last-child{border-right:0}
@media(max-width:800px){.trio>div{border-right:0;border-bottom:1px solid rgba(255,255,255,.1)}.trio>div:last-child{border-bottom:0}}
.trio h3{font-size:2rem;background:linear-gradient(90deg,#FFD58A,#F2A93B);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.trio p{margin:0;color:#EBDDC6}
/* map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:stretch}
@media(max-width:900px){.mapgrid{grid-template-columns:1fr}}
.mapbox{border-radius:32px;overflow:hidden;background:#24140A;box-shadow:var(--shadow)}
.mapbox svg{width:100%;height:auto;display:block}
.pin{filter:drop-shadow(0 0 7px currentColor)}
.list{background:var(--card);border-radius:32px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.list ol{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px;border-radius:18px;transition:background .2s}
.list li:hover{background:#FFF3DB}
.dot{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center}
.list small{display:block;color:var(--mute);font-size:.78rem}
.list .km{font-family:"Outfit";font-weight:700;font-size:1.25rem;color:var(--brown);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:14px 16px 8px;font-size:.8rem;color:var(--mute);margin-top:auto}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
@media(max-width:800px){.facts{grid-template-columns:1fr}}
.fact{background:var(--card);border-radius:28px;padding:24px;box-shadow:var(--shadow);color:var(--mute)}
.fact b{display:block;font-family:"Outfit";font-weight:800;font-size:3.6rem;line-height:1;margin-bottom:6px;background:linear-gradient(90deg,#4F8A24,#F2A93B);-webkit-background-clip:text;background-clip:text;color:transparent}
.src{font-size:.78rem;color:var(--mute);margin-top:16px}
/* plan */
.plan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;position:relative}
@media(max-width:860px){.plan{grid-template-columns:1fr}}
.pc{background:var(--card);border-radius:32px;padding:28px;box-shadow:var(--shadow);display:grid;gap:12px;align-content:start;position:relative;overflow:hidden}
.pc .num{position:absolute;right:20px;top:6px;font-family:"Outfit";font-weight:800;font-size:5.5rem;line-height:1;color:rgba(242,169,59,.16)}
.ic{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#7DBB45,#F2A93B)}
.ic svg{width:34px;height:34px}
.pc h3{font-size:1.9rem}
.pc p{margin:0;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.chips span{background:#FFF1D6;border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:700;color:#6B4311}
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:30px;font-family:"Outfit";font-weight:700;font-size:1.25rem}
.flow .b{background:var(--brown);color:#fff;border-radius:999px;padding:10px 24px}
.flow .a{color:var(--gold);font-size:1.6rem}
/* invest */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:760px){.mods{grid-template-columns:1fr}}
.mod{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border-radius:30px;padding:26px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:start;border:2px solid transparent;transition:border-color .25s,background .25s,transform .2s}
.mod:hover{transform:translateY(-3px)}
.mod:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.mod[aria-checked="true"]{border-color:var(--green);background:linear-gradient(160deg,#fff 40%,#F1F9E6)}
.mod h3{font-size:1.65rem}
.mod p{margin:6px 0 0;color:var(--mute);font-size:.96rem;grid-column:1}
.mod .price{grid-column:1/-1;font-family:"Outfit";font-weight:800;font-size:2.5rem;line-height:1;color:var(--brown);margin-top:8px}
.mod .price small{font-family:"Plus Jakarta Sans";font-weight:600;font-size:.85rem;color:var(--mute);margin-left:8px}
.sw{display:block;width:56px;height:32px;border-radius:999px;background:#E5DACA;position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mod[aria-checked="true"] .sw{background:var(--green)}
.mod[aria-checked="true"] .sw::after{transform:translateX(24px)}

.mod.on,.mod[aria-checked="true"]{border-color:var(--green);background:linear-gradient(160deg,#fff 40%,#F1F9E6)}
.mod.c2{align-content:start}
.mh{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.mod.c2>p{grid-column:1/-1;margin:0}
.swb{all:unset;display:block;cursor:pointer;flex:none}
.swb:focus-visible,.seg button:focus-visible,.half:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.swb[aria-checked="true"] .sw,.half[aria-checked="true"] .sw{background:var(--green)}
.swb[aria-checked="true"] .sw::after,.half[aria-checked="true"] .sw::after{transform:translateX(24px)}
.pickl{grid-column:1/-1;font-weight:700;font-size:.82rem;color:var(--mute);letter-spacing:.02em;margin-top:2px}
.seg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 4px;border-radius:16px;background:#F4EBDC;font-family:"Outfit";font-weight:700;font-size:1.1rem;color:var(--brown);transition:background .2s,color .2s,transform .15s}
.seg button:hover{transform:translateY(-2px)}
.seg button[aria-checked="true"]{background:var(--brown);color:#fff}
.halves{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.half{all:unset;box-sizing:border-box;cursor:pointer;border-radius:22px;border:2px solid #EADFCB;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center;transition:border-color .25s,background .25s}
.half[aria-checked="true"]{border-color:var(--green);background:#F1F9E6}
.half .hn{font-family:"Outfit";font-weight:700;font-size:1.35rem}
.half .hp{grid-column:1/-1;font-family:"Outfit";font-weight:800;font-size:1.8rem;line-height:1;color:var(--brown)}
.half .hp small{font-family:"Plus Jakarta Sans";font-weight:600;font-size:.78rem;color:var(--mute);margin-left:6px}
.cafe{margin-top:18px;border-radius:36px;padding:clamp(26px,5vw,52px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,4vw,40px);align-items:center;color:#fff;background:radial-gradient(600px 300px at 100% 0%,rgba(242,169,59,.45),transparent 60%),linear-gradient(120deg,#2A1707,#4A2D12);box-shadow:0 30px 60px -30px rgba(42,23,7,.7)}
.cafe .cup{width:clamp(72px,12vw,110px);height:clamp(72px,12vw,110px);border-radius:32px;background:linear-gradient(135deg,#FFD58A,#F2A93B);display:grid;place-items:center}
.cafe .cup svg{width:58%;height:58%}
.cafe h3{font-size:clamp(1.9rem,5vw,3.2rem);font-weight:800}
.cafe p{margin:12px 0 0;color:#F0E2C8;font-size:clamp(1.05rem,2vw,1.3rem);max-width:56ch}
@media(max-width:560px){.cafe{grid-template-columns:1fr}}

.bdg{grid-column:1/-1;justify-self:start;font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:#E4F3D4;color:#3C6B16}
.feats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.feats span{background:#FFF1D6;border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:700;color:#6B4311}
.delivery{margin-top:34px;border-radius:30px;padding:clamp(18px,3vw,28px);background:#FFF3DB;border:1.5px dashed #E3C98E}
.dhead h3{font-size:1.6rem;margin-top:8px}
.dhead p{margin:6px 0 0;color:var(--mute);font-size:.95rem}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media(max-width:800px){.dgrid{grid-template-columns:1fr}}
.dcard{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border-radius:22px;padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;border:2px solid transparent;transition:border-color .25s,background .25s}
.dcard:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.dcard[aria-checked="true"]{border-color:var(--green);background:#F1F9E6}
.dcard .hn{font-family:"Outfit";font-weight:700;font-size:1.3rem}
.dcard .dd{grid-column:1/-1;color:var(--mute);font-size:.88rem;line-height:1.4}
.dcard .dp{grid-column:1/-1;font-family:"Outfit";font-weight:800;font-size:1.6rem;line-height:1;color:var(--brown)}
.dcard .dp small{font-family:"Plus Jakarta Sans";font-weight:600;font-size:.78rem;color:var(--mute);margin-left:6px}
.dcard[aria-checked="true"] .sw{background:var(--green)}
.dcard[aria-checked="true"] .sw::after{transform:translateX(24px)}
.total{position:sticky;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:22px;border-radius:30px;padding:clamp(18px,3vw,28px) clamp(20px,4vw,38px);color:#fff;background:linear-gradient(120deg,rgba(42,23,7,.96),rgba(62,40,16,.96));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 60px -24px rgba(42,23,7,.7);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px}
@media(max-width:560px){.total{gap:10px 14px}}
.total .k{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.total .v{font-family:"Outfit";font-weight:800;font-size:clamp(1.9rem,6vw,3.4rem);line-height:1.05;margin-top:2px;white-space:nowrap}
.total .s{color:#D9C9AE;font-size:.82rem;margin-top:4px;line-height:1.3}
.notes{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:8px;color:var(--mute);font-size:.94rem}
.notes li::before{content:"•";color:var(--gold);font-weight:800;margin-right:10px}
.next{margin-top:18px;border-radius:26px;padding:22px 28px;font-family:"Outfit";font-weight:700;font-size:1.3rem;color:var(--brown);background:linear-gradient(120deg,#FFE3A8,#E5F3C9)}
/* DNA */
.sig{background:#17324A;color:#fff;border-top:6px solid #669DCF}
